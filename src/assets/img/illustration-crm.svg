<svg width="320" height="220" viewBox="0 0 320 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="crmGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crmBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="crmCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="320" height="220" fill="url(#crmGlow)"/>

  <!-- Progress ring card -->
  <g transform="translate(20,26)">
    <rect width="118" height="168" rx="18" fill="url(#crmCard)" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="59" cy="66" r="40" stroke="#ffffff" stroke-opacity="0.08" stroke-width="10" fill="none"/>
    <circle cx="59" cy="66" r="40" stroke="#34d399" stroke-width="10" fill="none"
      stroke-linecap="round" stroke-dasharray="251.2" stroke-dashoffset="62"
      transform="rotate(-90 59 66)"/>
    <text x="59" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#f7f7f8">86%</text>
    <rect x="18" y="126" width="82" height="8" rx="4" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="18" y="142" width="56" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
  </g>

  <!-- Bar chart card -->
  <g transform="translate(152,26)">
    <rect width="148" height="94" rx="18" fill="url(#crmCard)" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="20" y="56" width="14" height="24" rx="4" fill="url(#crmBar)"/>
    <rect x="44" y="40" width="14" height="40" rx="4" fill="url(#crmBar)"/>
    <rect x="68" y="24" width="14" height="56" rx="4" fill="url(#crmBar)"/>
    <rect x="92" y="34" width="14" height="46" rx="4" fill="url(#crmBar)"/>
    <rect x="116" y="16" width="14" height="64" rx="4" fill="url(#crmBar)"/>
  </g>

  <!-- Calendar / avatars card -->
  <g transform="translate(152,132)">
    <rect width="148" height="62" rx="18" fill="url(#crmCard)" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="26" cy="31" r="14" fill="#34d399" fill-opacity="0.55"/>
    <circle cx="50" cy="31" r="14" fill="#9aa5b1" fill-opacity="0.35"/>
    <circle cx="74" cy="31" r="14" fill="#9aa5b1" fill-opacity="0.22"/>
    <rect x="98" y="24" width="34" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="98" y="36" width="24" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.08"/>
  </g>
</svg>
