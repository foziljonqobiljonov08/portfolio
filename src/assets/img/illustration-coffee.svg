<svg width="320" height="220" viewBox="0 0 320 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coffeeGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coffeeCup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7e9ec"/>
      <stop offset="100%" stop-color="#c7cbd1"/>
    </linearGradient>
    <linearGradient id="coffeeLiquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c4a1e"/>
      <stop offset="100%" stop-color="#4a2c12"/>
    </linearGradient>
    <linearGradient id="coffeeCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="320" height="220" fill="url(#coffeeGlow)"/>

  <!-- steam -->
  <g stroke="#d97706" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M132 40c-10-10 10-16 0-28">
      <animate attributeName="d" dur="3.2s" repeatCount="indefinite"
        values="M132 40c-10-10 10-16 0-28;M132 40c10-10 -10-16 0-28;M132 40c-10-10 10-16 0-28"/>
    </path>
    <path d="M158 40c-10-10 10-16 0-28">
      <animate attributeName="d" dur="3.2s" begin="0.5s" repeatCount="indefinite"
        values="M158 40c-10-10 10-16 0-28;M158 40c10-10 -10-16 0-28;M158 40c-10-10 10-16 0-28"/>
    </path>
  </g>

  <!-- Coffee cup -->
  <g transform="translate(96,52)">
    <path d="M6 8h96l-10 88a16 16 0 0 1-16 14H32a16 16 0 0 1-16-14L6 8Z" fill="url(#coffeeCup)"/>
    <path d="M14 16h84l-2 18H16l-2-18Z" fill="url(#coffeeLiquid)"/>
    <path d="M100 20c22-4 30 26 4 30" stroke="#c7cbd1" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="0" y="0" width="108" height="10" rx="5" fill="#f7f7f8"/>
  </g>

  <!-- Bean card left -->
  <g transform="translate(20,132)">
    <rect width="90" height="62" rx="16" fill="url(#coffeeCard)" stroke="#ffffff" stroke-opacity="0.08"/>
    <ellipse cx="32" cy="31" rx="16" ry="11" fill="#7c4a1e" fill-opacity="0.7" transform="rotate(-25 32 31)"/>
    <path d="M22 31c6-6 14-6 20 0" stroke="#2a1808" stroke-width="2" fill="none" transform="rotate(-25 32 31)"/>
    <rect x="58" y="20" width="24" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="58" y="33" width="18" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
  </g>

  <!-- Order / bag card right -->
  <g transform="translate(210,132)">
    <rect width="90" height="62" rx="16" fill="url(#coffeeCard)" stroke="#ffffff" stroke-opacity="0.08"/>
    <path d="M24 24h18l3 26H21l3-26Z" fill="#d97706" fill-opacity="0.7"/>
    <path d="M27 24a6 6 0 0 1 12 0" stroke="#f7f7f8" stroke-width="3" fill="none"/>
    <rect x="52" y="26" width="26" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="52" y="39" width="18" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
  </g>
</svg>
